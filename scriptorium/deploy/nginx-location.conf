# Vložit do server { } bloku s HTTPS. Aplikace pak běží na https://<doména>/publisher/
client_max_body_size 200m;

location = /publisher { return 301 /publisher/; }

location /publisher/ {
    proxy_pass http://127.0.0.1:2209/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 600s;
    proxy_buffering off;   # streamování odpovědí sloupce Dotaz
}
