<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Přihlášení – Publisher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #e9ebee;
  font: 20px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; }
form { background: #fff; padding: 40px 44px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.12); width: min(440px, 94vw); }
h1 { margin: 0 0 6px; font-size: 30px; }
p.sub { margin: 0 0 26px; color: #57606a; font-size: 17px; }
label { display: block; font-weight: 600; margin: 16px 0 6px; }
input { width: 100%; font-size: 26px; padding: 12px 16px; border: 2px solid #b8bec6; border-radius: 10px; }
input:focus { outline: none; border-color: #1f6feb; }
#pin { letter-spacing: .4em; }
button { width: 100%; margin-top: 28px; font-size: 24px; padding: 16px; border: 0; border-radius: 10px; background: #1f6feb; color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: #b42318; font-weight: 600; min-height: 1.4em; margin-top: 14px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Publisher</h1>
  <p class="sub">Zdrojové knihy a rukopis</p>
  <label for="user">Jméno</label>
  <input id="user" name="username" autocomplete="username" autocapitalize="none" required>
  <label for="pin">PIN</label>
  <input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" required>
  <button id="go" type="submit">Přihlásit se</button>
  <div id="err" class="err"></div>
</form>
<script>
const f = document.getElementById("f");
document.getElementById("user").value = localStorage.getItem("publisher.user") || "";
(document.getElementById("user").value ? document.getElementById("pin") : document.getElementById("user")).focus();
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  const user = document.getElementById("user").value, pin = document.getElementById("pin").value;
  try {
    const res = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user, pin }) });
    const data = await res.json();
    if (res.ok && data.ok) { localStorage.setItem("publisher.user", user); location.href = "./"; return; }
    err.textContent = data.error || "Přihlášení se nepovedlo.";
  } catch (x) { err.textContent = "Server neodpovídá."; }
  document.getElementById("pin").value = "";
  document.getElementById("pin").focus();
  btn.disabled = false;
});
</script>
</body>
</html>
